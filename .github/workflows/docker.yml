name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase, but the owner may not be.
      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Run the image once before publishing it: migrations, health check, unprivileged user.
      - name: Build image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: trakko:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name trakko-smoke -p 8000:8000 trakko:smoke
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health | grep -q '"ok"'; then
              echo "health check passed"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs trakko-smoke
              echo "health check failed" >&2
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/ > /dev/null
          curl --fail --silent http://127.0.0.1:8000/api/v1/tracks | grep -q '"is_default":true'
          test "$(docker exec trakko-smoke id -u)" != "0"
          docker rm --force trakko-smoke

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
